<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <!-- IMPORT GOOGLE ICONS -->

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
  </head>
  <body>
    <section class="overall-container">
      <h2 class="weather-app-title">Weather Forecast</h2>
      <main class="main-container">
        <header>
          <input class="city-input" type="text" placeholder="Search a city" />
          <button class="search-btn">
            <span class="material-symbols-outlined"> search </span>
          </button>
        </header>

        <section id="weatherInfo" class="weather-info" style="display: none">
          <div class="location-date-container">
            <div class="location">
              <span class="material-symbols-outlined"> location_on </span>
              <h4 class="country-txt">Singapore</h4>
            </div>
            <h5 class="current-date-txt regular-txt">Wed, 07 Aug</h5>
          </div>

          <div class="weather-summary-container">
            <img src="images/clouds.svg" class="weather-summary-img" />
            <div class="weather-summary-info">
              <h1 class="temp-txt">29 °C</h1>
              <!-- °C copied from symbolsdb.com -->
              <h2 class="condition-txt regular-txt">Clouds</h2>
            </div>
          </div>

          <div class="weather-conditions-container">
            <div class="condition-item">
              <span class="material-symbols-outlined"> water_drop </span>
              <div class="condition-info">
                <h5 class="regular-txt">Humidity</h5>
                <h5 class="humidity-value-txt">55%</h5>
              </div>
            </div>

            <div class="condition-item">
              <span class="material-symbols-outlined"> air </span>
              <div class="condition-info">
                <h5 class="regular-txt">Wind Speed</h5>
                <h5 class="wind-value-txt">2 M/s</h5>
              </div>
            </div>
          </div>

          <div class="forecast-items-container"></div>
        </section>
        <section
          id="searchCity"
          class="search-city section-message"
          style="display: none"
        >
          <img src="images/search-city.png" alt="" />
          <div>
            <h1>Search city</h1>
            <h4>Find out the weather conditions of the city</h4>
          </div>
        </section>

        <section
          id="notFound"
          class="not-found section-message"
          style="display: none"
        >
          <img src="images/not-found.png" alt="" />
          <div>
            <h1>Search city</h1>
            <h4>Find out the weather conditions of the city</h4>
          </div>
        </section>
      </main>
    </section>

    <script src="main.js"></script>
  </body>
</html>
